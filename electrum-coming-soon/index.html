<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electrum | Coming Soon</title>
  <meta
    name="description"
    content="Electrum is coming soon. Join the first wave and get notified when the new launch experience goes live."
  >
  <meta name="theme-color" content="#06090d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="page-shell">
    <header class="site-header" aria-label="Electrum">
      <a class="brand" href="./index.html" aria-label="Electrum home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Electrum</span>
      </a>
    </header>

    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <h1 id="hero-title">Coming Soon</h1>
        <p class="hero-current">A new current is forming.</p>
        <p class="hero-lede">
          We are shaping a luminous digital launch experience. Join the first wave
          and get notified when Electrum goes live.
        </p>

        <form class="notify-form" action="mailto:hello@electrum.site" method="post" enctype="text/plain">
          <label class="sr-only" for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="hello@electrum.site" autocomplete="email" required>
          <button type="submit">Notify me</button>
        </form>

        <p class="launch-note">
          <span aria-hidden="true"></span>
          Launch window: 2026
        </p>
      </div>

      <div class="orbit-wrap" aria-hidden="true">
        <div class="orbit-field">
          <div class="ring ring-gold"></div>
          <div class="ring ring-cyan"></div>
          <div class="ring ring-quiet"></div>
          <div class="lightning lightning-one"></div>
          <div class="lightning lightning-two"></div>
          <span class="spark spark-one"></span>
          <span class="spark spark-two"></span>
          <span class="spark spark-three"></span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
